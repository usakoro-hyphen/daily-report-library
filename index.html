<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報図書館</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1 class="title">日報図書館</h1>
    </header>

    <!-- API設定モーダル -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <h3>⚙️ 設定</h3>
                <button id="closeSettingsModal" class="btn close">&times;</button>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <label for="geminiApiKeyInput">Gemini APIキー</label>
                    <p class="setting-description">Google AI StudioでAPIキーを取得できます</p>
                    <div class="api-key-input-group">
                        <input type="password" id="geminiApiKeyInput" class="api-key-input" placeholder="APIキーを入力...">
                        <button id="toggleApiKeyVisibility" class="btn small">👁️</button>
                    </div>
                </div>
                <div class="setting-actions">
                    <button id="saveApiKeyBtn" class="btn primary">保存</button>
                    <button id="testApiKeyBtn" class="btn secondary">接続テスト</button>
                </div>
                <div id="apiTestResult" class="api-test-result hidden"></div>
                <hr class="setting-divider">
                <div class="setting-item">
                    <label class="toggle-label">
                        <span>削除ボタンを表示する</span>
                        <input type="checkbox" id="toggleDeleteBtns">
                        <span class="toggle-slider"></span>
                    </label>
                    <p class="setting-description">ONにするとライブラリの各アイテムに削除ボタンが表示されます</p>
                </div>
                <hr class="setting-divider">
                <div class="setting-item">
                    <label>一括削除</label>
                    <div class="danger-zone">
                        <button id="clearWordLibraryBtn" class="btn tiny danger">ワードライブラリを全て削除</button>
                        <button id="clearLibraryBtn" class="btn tiny danger">テキストファイルライブラリを全て削除</button>
                        <button id="clearAllBtn" class="btn tiny danger">なにもかも削除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="main-container">
        <!-- テキスト表示エリア -->
        <section id="contentArea" class="content-area">
            <div class="content-header">
                <h2 id="documentTitle" class="document-title">ドキュメントが選択されていません</h2>
                <div class="content-actions">
                    <button id="saveToLibraryBtn" class="btn small" disabled>ライブラリに保存</button>
                    <button id="clearBtn" class="btn small secondary" disabled>クリア</button>
                </div>
            </div>
            <div id="textDisplay" class="text-display">
                <p class="placeholder">読み込みボタンをクリックしてテキストファイルを読み込んでください</p>
                <div class="placeholder-action">
                    <!-- ドラッグ&ドロップエリア -->
                    <div id="dropZone" class="drop-zone hidden">
                        <div class="drop-content">
                            <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <p class="drop-text">テキストファイル（.txt）をここにドラッグ&ドロップ</p>
                            <p class="drop-subtext">またはクリックしてファイルを選択</p>
                        </div>
                        <input type="file" id="fileInput" accept=".txt" multiple hidden>
                    </div>
                    <button id="loadBtnInline" class="btn primary">読み込み</button>
                    <button id="cameraBtn" class="btn secondary">📷 カメラで文字読み取り</button>
                </div>
            </div>
        </section>

        <!-- OCRカメラモーダル -->
        <div id="ocrModal" class="modal hidden">
            <div class="modal-content ocr-modal">
                <div class="modal-header">
                    <h3>📷 カメラで文字読み取り</h3>
                    <button id="closeOcrModal" class="btn close">&times;</button>
                </div>
                <div class="ocr-body">
                    <div class="camera-container">
                        <video id="cameraVideo" class="camera-video" autoplay playsinline></video>
                        <canvas id="captureCanvas" class="capture-canvas hidden"></canvas>
                        <div class="camera-controls">
                            <button id="captureBtn" class="btn primary">📸 撮影</button>
                            <button id="retakeBtn" class="btn secondary hidden">🔄 撮り直し</button>
                            <button id="recognizeBtn" class="btn success hidden">🔍 文字認識</button>
                        </div>
                    </div>
                    <div class="ocr-result hidden">
                        <h4>認識結果</h4>
                        <textarea id="ocrResultText" class="ocr-textarea" placeholder="認識されたテキストがここに表示されます..."></textarea>
                        <div class="ocr-actions">
                            <button id="editOcrBtn" class="btn primary">✏️ 編集</button>
                            <button id="saveOcrBtn" class="btn success">💾 ライブラリに保存</button>
                            <button id="cancelOcrBtn" class="btn secondary">キャンセル</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ワードライブラリエリア -->
        <section id="wordLibraryArea" class="library-area">
            <div class="library-header">
                <h2 class="library-title">ワードライブラリ</h2>
                <div class="library-controls">
                    <input type="text" id="wordSearch" class="search-box" placeholder="用語を検索...">
                </div>
            </div>
            <div id="gojuonFilter" class="gojuon-filter">
                <button class="gojuon-btn active" data-row="all">全て</button>
                <button class="gojuon-btn" data-row="あ">あ</button>
                <button class="gojuon-btn" data-row="か">か</button>
                <button class="gojuon-btn" data-row="さ">さ</button>
                <button class="gojuon-btn" data-row="た">た</button>
                <button class="gojuon-btn" data-row="な">な</button>
                <button class="gojuon-btn" data-row="は">は</button>
                <button class="gojuon-btn" data-row="ま">ま</button>
                <button class="gojuon-btn" data-row="や">や</button>
                <button class="gojuon-btn" data-row="ら">ら</button>
                <button class="gojuon-btn" data-row="わ">わ</button>
                <button class="gojuon-btn" data-row="alpha">A~Z</button>
                <button class="gojuon-btn" data-row="numsym">数字/記号</button>
            </div>
            <div id="wordLibraryGrid" class="library-grid">
                <!-- ワードライブラリアイテムがここに表示されます -->
            </div>
            <!-- 用語詳細表示エリア -->
            <div id="wordDetail" class="word-detail hidden">
                <div class="word-detail-header">
                    <h3 id="wordDetailTitle" class="word-detail-title"></h3>
                    <button id="closeWordDetail" class="btn small secondary">×</button>
                </div>
                <div id="wordDetailContent" class="word-detail-content"></div>
            </div>
        </section>

        <!-- テキストファイルライブラリエリア -->
        <section id="libraryArea" class="library-area">
            <div class="library-header">
                <h2 class="library-title">テキストファイルライブラリ</h2>
                <div class="library-controls">
                    <input type="text" id="librarySearch" class="search-box" placeholder="ファイル名を検索...">
                </div>
            </div>
            <div id="libraryGrid" class="library-grid">
                <!-- ライブラリアイテムがここに表示されます -->
            </div>
        </section>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="footer-controls">
            <button id="settingsBtn" class="btn small settings-btn" title="設定">⚙️ 設定</button>
        </div>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
